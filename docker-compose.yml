services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wind-dashboard-backend
    ports:
      - "8000:8000"
    volumes:
      - sqlite-data:/app/data
    environment:
      - DATABASE_PATH=/app/data/windforecast.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wind-dashboard-frontend
    ports:
      - "3001:3000"
    environment:
      - VITE_API_PROXY_TARGET=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sqlite-data:
    driver: local
